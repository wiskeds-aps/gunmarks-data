name: Update marks thresholds

on:
  schedule:
    - cron: "0 4 * * 1"  # every Monday 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest thresholds from poliroid.me
        run: python3 scripts/fetch_poliroid.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "no changes"
            exit 0
          fi
          git add data/
          git commit -m "Update marks thresholds ($(date -u +%Y-%m-%d))"
          git push
